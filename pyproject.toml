[build-system]
requires = ["setuptools>=45",
            "setuptools_scm[toml]>=6.2",
            "wheel"]
build-backend = 'setuptools.build_meta'

[project]
name = "gdctb_cape_eea"
description = "A Python package to process and analyze data from the GDCTB cape_eea instrument."
readme = "README.rst"
dynamic = ["version"]
authors = [{name = "Andrew Robbertz", email="andrew.l.robbertz@nasa.gov"}]
license = {file = "LICENSE.rst"}
requires-python = ">=3.12"
keywords = ["nasa mission", "space weather"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache 2.0",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  'astropy>=4.1.0',
  'numpy>=1.16.0',
  'swxsoc @ git+https://github.com/swxsoc/swxsoc.git@main',
]

[project.optional-dependencies]
dev = [
  "gdctb_cape_eea[docs,test,style]"
]

docs = [
  'sphinx',
  'sphinx-automodapi',
  'pydata-sphinx-theme',
]

test = [
  'pytest',
  'pytest-astropy',
  'pytest-cov',
  'coverage[toml]'
]

style = ['ruff']

[tool.setuptools.package-data]
"gdctb_cape_eea.data" = ["**"]

[tool.setuptools]
packages = ["gdctb_cape_eea"]

[tool.setuptools_scm]
write_to = "gdctb_cape_eea/_version.py"

[tool.pytest.ini_options]
testpaths = [
   "gdctb_cape_eea/tests",
   "docs"
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
  'gdctb_cape_eea/__init*',
  'gdctb_cape_eea/conftest.py',
  'gdctb_cape_eea/*setup_package*',
  'gdctb_cape_eea/tests/*',
  'gdctb_cape_eea/*/tests/*',
  'gdctb_cape_eea/extern/*',
  'gdctb_cape_eea/version*',
  '*/gdctb_cape_eea/__init*',
  '*/gdctb_cape_eea/conftest.py',
  '*/gdctb_cape_eea/*setup_package*',
  '*/gdctb_cape_eea/tests/*',
  '*/gdctb_cape_eea/*/tests/*',
  '*/gdctb_cape_eea/extern/*',
  '*/gdctb_cape_eea/version*',
]

